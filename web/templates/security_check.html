<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111F" />
  <title>Security check — FloraCore</title>

  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}?v=20260901">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/security_check.css') }}?v=20260901-turnstile-csp3" />
</head>
<body>
  <main class="security-shell">
    <a class="security-brand" href="/" aria-label="FloraCore">
      <span class="security-mark" aria-hidden="true">◇</span>
      <span>FloraCore</span>
    </a>

    <section class="security-card">
      <div class="security-scanline" aria-hidden="true"></div>
      <span class="security-kicker">FLORACORE / EDGE SECURITY</span>
      <h1>Verifying this connection.</h1>
      <p>Complete the Cloudflare security check to enter FloraCore.</p>

      <div class="security-check-frame">
        <div
          id="siteEntryTurnstile"
          data-site-key="{{ turnstile_site_key }}"
          data-next="{{ next_url }}"
        ></div>
        <div class="security-status" id="securityStatus" role="status" aria-live="polite">
          Preparing security check…
        </div>
      </div>

      <div class="security-meta">
        <span><i></i>SECURE ENTRY</span>
        <span>No device credentials are involved</span>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/security_check.js') }}?v=20260901-turnstile-csp3" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</body>
</html>
